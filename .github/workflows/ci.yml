name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift run FocusCoreChecks
      - name: Local Git integration
        run: ./scripts/check-localgit.sh
      - name: Package app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Focus-Island-macOS
          path: dist/Focus-Island-macOS.zip
